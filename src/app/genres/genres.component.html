<div class="genres-page">
  <h1 class="title">Anime Genres</h1>
  <p class="subtitle">Explore anime by genre. Click on a genre to view all related anime.</p>

  <!-- Contenitore dei generi -->
  <div class="genres-container">
    <div *ngFor="let genre of genres" class="genres-card" (click)="viewAnimeByGenre(genre.mal_id)">
      <h3>{{ genre.name }}</h3>
    </div>
  </div>

  <!-- Messaggio di caricamento -->
  <p *ngIf="genres.length === 0" class="loading-text">Loading genres...</p>
</div>
