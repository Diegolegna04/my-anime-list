<div class="hero-section">
    <div class="hero-content">
      <h1>Benvenuto su My Anime DB!</h1>
      <p>
        Esplora la nostra classifica con i migliori titoli e scopri cosa guardare dopo.
        Immergiti nel mondo fantastico degli anime oggi stesso!
      </p>
      <div class="hero-buttons">
        <button type="button" class="btn btn-light" (click)="onTopAnimeClick()">
          <i class="fas fa-trophy" aria-hidden="true"></i>
          Top anime
        </button>
        <a class="btn btn-glass" [routerLink]="['/seasonal', currentSeason]">
          <i class="fas fa-calendar-alt" aria-hidden="true"></i>
          Anime stagionali
        </a>
      </div>
    </div>
</div>
