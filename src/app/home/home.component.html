<!-- Lista degli Anime Popolari -->
<div *ngIf="currentView === 'list'" class="div">
  <h1>Top Anime</h1>
  <div class="anime-container">
    <div
      *ngFor="let anime of animeList"
      class="anime-card"
      (click)="goToDetails(anime.mal_id)"
    >
      <img [src]="anime.images.jpg.image_url" alt="{{ anime.title }}" />
      <h3>{{ anime.title }}</h3>
    </div>
  </div>

  <!-- Messaggio di caricamento -->
  <p *ngIf="isLoading" class="loading-text">Caricamento altri anime...</p>

  <!-- Bottone per caricare altri anime -->
  <button
    *ngIf="!isLoading"
    (click)="loadMoreAnime()"
    class="load-more-btn"
  >
    Carica Altri Anime
  </button>
</div>
