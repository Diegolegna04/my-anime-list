<div>
  <!-- Sezione introduttiva -->
  <div class="intro">
    <div class="intro-content">
      <h1>Benvenuto sul mio My Anime List!</h1>
      <p>
        Esplora la nostra classifica con i migliori titoli e scopri cosa guardare dopo.
        Entra nel mondo degli anime oggi stesso!
      </p>
    </div>
  </div>

  <div class="bottoni">
    <!-- Bottone per cambiare la lingua del titolo -->
    <button (click)="toggleTitleLanguage()" class="language-toggle-btn">
      Cambia Lingua Titolo
    </button>
  </div>
  <!-- Lista degli anime popolari -->
  <div class="div">
    <h2 class="section-title">Anime Popolari</h2>
    <div class="view-toggle">
      <button (click)="toggleView()" aria-label="Cambia Visualizzazione">
        <i [class]="isGridView ? 'fas fa-list' : 'fas fa-th'"></i>
      </button>
    </div>
  </div>
  <div [class.grid]="isGridView" [class.list]="!isGridView" class="anime-container">
    <div
      *ngFor="let anime of animeList"
      class="anime-card"
      (click)="goToDetails(anime.mal_id)"
    >
      <img [src]="anime.images.jpg.image_url" alt="{{ anime.title }}"/>
      <h3 class="anime-title">{{ getTitle(anime) }}</h3>
    </div>
  </div>

  <!-- Messaggio di caricamento -->
  <p *ngIf="isLoading" class="loading-text">Caricamento anime...</p>

  <!-- Bottone per caricare altri anime -->
  <button
    *ngIf="!isLoading"
    (click)="loadMoreAnime()"
    class="load-more-btn"
  >
    Carica Altri Anime
  </button>
</div>
