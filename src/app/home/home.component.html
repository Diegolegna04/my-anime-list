<div class="dashboard-container">
  <!-- Hero Section -->
  <app-hero-section
    [currentSeason]="activeSeasonSlug"
    (topAnimeClick)="currentView = 'list'">
  </app-hero-section>
  <!-- Top Anime Section -->
  <app-top-anime
    [animeList]="animeList"
    [isLoading]="isLoading"
    [hasError]="topAnimeError"
    (loadMore)="loadMoreAnime()"
    (retry)="loadTopAnime()">
  </app-top-anime>
  <!-- Seasonal Section -->
  <app-seasonal-anime
    [seasonalAnimeList]="seasonalAnimeList"
    [season]="activeSeason">
  </app-seasonal-anime>
  <app-random-anime></app-random-anime>
  <!-- Genres Section -->
  <app-genres-home></app-genres-home>
</div>
