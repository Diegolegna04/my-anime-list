<section class="panel top-anime-section" id="top-anime">
  <div class="section-header">
    <h2 class="section-title">Top anime</h2>
    <div class="section-controls">
      <app-title-language-toggle [value]="titleLanguage" (valueChange)="setTitleLanguage($event)"></app-title-language-toggle>
      <div class="segmented" role="group" aria-label="Visualizzazione">
        <button type="button" [class.active]="isGridView" [attr.aria-pressed]="isGridView" (click)="isGridView = true" aria-label="Griglia">
          <i class="fas fa-th-large" aria-hidden="true"></i>
        </button>
        <button type="button" [class.active]="!isGridView" [attr.aria-pressed]="!isGridView" (click)="isGridView = false" aria-label="Lista">
          <i class="fas fa-list" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </div>

  <div [class.anime-grid]="isGridView" [class.anime-list]="!isGridView">
    @for (anime of animeList; track anime; let i = $index) {
      <app-anime-card
        [anime]="anime"
        [rank]="i + 1"
        [titleLanguage]="titleLanguage"
        [viewMode]="isGridView ? 'grid' : 'list'">
      </app-anime-card>
    }
  </div>

  @if (isLoading) {
    <div class="loading-state" role="status">
      <span class="spinner" aria-hidden="true"></span>
      <p>Caricamento anime in corso...</p>
    </div>
  }

  @if (!isLoading && animeList.length > 0) {
    <div class="top-anime-actions">
      <button type="button" (click)="loadMore.emit()" class="btn btn-primary">
        <i class="fas fa-plus-circle" aria-hidden="true"></i>
        Carica altri anime
      </button>
    </div>
  }
</section>
