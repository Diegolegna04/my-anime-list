<div class="auth-container">
  <div class="form-wrapper" role="region" aria-labelledby="fp-heading">
    <h2 id="fp-heading">Password dimenticata?</h2>

    <ng-container *ngIf="!submitted; else confirmationBlock">
      <p class="sub-heading">Inserisci l'email con cui ti sei registrato: ti invieremo un link per reimpostare la password.</p>

      <form (ngSubmit)="onSubmit()" #fpForm="ngForm" novalidate>
        <div class="input-group">
          <label for="fp-email">Email</label>
          <div class="input-with-icon">
            <label for="fp-email">
              <img src="/email-icon.png" alt="Email Icon" />
            </label>
            <input id="fp-email" name="email" type="email" [(ngModel)]="email" required email
              placeholder="esempio@email.com" autocomplete="email" />
          </div>
        </div>

        <button type="submit" [disabled]="isLoading || fpForm.invalid">
          <span *ngIf="!isLoading">Invia link di reset</span>
          <span *ngIf="isLoading" class="loading-spinner">
            <span class="spinner"></span>
            Invio in corso...
          </span>
        </button>

        <p class="toggle-link-container">
          <a routerLink="/register-login">Torna al login</a>
        </p>
      </form>
    </ng-container>

    <ng-template #confirmationBlock>
      <p class="sub-heading">
        Se l'indirizzo <strong>{{ email }}</strong> è registrato, riceverai a breve un'email con le istruzioni per reimpostare la password.
      </p>
      <p class="toggle-link-container">
        <a routerLink="/register-login">Torna al login</a>
      </p>
    </ng-template>
  </div>
</div>
