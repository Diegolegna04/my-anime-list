<div class="auth-page">
  <div class="auth-card" role="region" aria-labelledby="fp-heading">
    <span class="auth-card-icon" aria-hidden="true"><i class="fas fa-key"></i></span>
    <h1 id="fp-heading" class="auth-title">Password dimenticata?</h1>

    <ng-container *ngIf="!submitted; else confirmationBlock">
      <p class="auth-subtitle">Inserisci l'email con cui ti sei registrato: ti invieremo un link per reimpostare la password.</p>

      <form (ngSubmit)="onSubmit()" #fpForm="ngForm" novalidate>
        <div class="field">
          <label class="field-label" for="fp-email">Email</label>
          <div class="input-icon">
            <i class="fas fa-envelope" aria-hidden="true"></i>
            <input id="fp-email" name="email" type="email" class="input" [(ngModel)]="email" required email
              placeholder="esempio@email.com" autocomplete="email" />
          </div>
        </div>

        <p class="alert alert-error form-alert" *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>

        <button type="submit" class="btn btn-primary btn-block" [disabled]="isLoading || fpForm.invalid">
          <ng-container *ngIf="!isLoading">Invia link di reset</ng-container>
          <ng-container *ngIf="isLoading">
            <span class="spinner spinner-sm" aria-hidden="true"></span>
            Invio in corso...
          </ng-container>
        </button>
      </form>

      <p class="auth-footer">
        <a routerLink="/register-login">Torna al login</a>
      </p>
    </ng-container>

    <ng-template #confirmationBlock>
      <p class="auth-subtitle" role="status">
        Se l'indirizzo <strong>{{ email }}</strong> è registrato, riceverai a breve un'email con le istruzioni per reimpostare la password.
      </p>
      <p class="auth-footer">
        <a routerLink="/register-login">Torna al login</a>
      </p>
    </ng-template>
  </div>
</div>
