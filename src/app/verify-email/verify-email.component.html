<div class="auth-page">
  <div class="auth-card">
    <ng-container [ngSwitch]="status">
      <div *ngSwitchCase="'loading'" class="state" role="status">
        <span class="spinner" aria-hidden="true"></span>
        <p class="state-text">Verifica dell'account in corso...</p>
      </div>

      <div *ngSwitchCase="'success'" class="state state-success" role="status">
        <span class="state-icon" aria-hidden="true"><i class="fas fa-check"></i></span>
        <h1 class="state-title">Email verificata!</h1>
        <p class="state-text">{{ message }}</p>
        <p class="redirect-hint">Verrai reindirizzato al login tra qualche secondo...</p>
        <a routerLink="/register-login" class="btn btn-primary">Vai al login ora</a>
      </div>

      <div *ngSwitchCase="'error'" class="state state-error" role="alert">
        <span class="state-icon" aria-hidden="true"><i class="fas fa-times"></i></span>
        <h1 class="state-title">Verifica non riuscita</h1>
        <p class="state-text">{{ message }}</p>
        <a routerLink="/register-login" class="btn btn-primary">Torna al login</a>
      </div>
    </ng-container>
  </div>
</div>
