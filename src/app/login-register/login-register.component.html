<div class="auth-container">
  <div class="form-wrapper">
    <!-- Form dinamico -->
    @if (!isRegistering) {
      <h2>Login</h2>
    }
    @if (isRegistering) {
      <h2>Registrati</h2>
    }

    <form (ngSubmit)="isRegistering ? onRegister() : onLogin()">
      <!-- Campi per il login -->
      @if (!isRegistering) {
        <label for="username">Username:</label>
        <input
          type="text"
          id="username"
          [(ngModel)]="loginData.username"
          name="username"
          required
          />
        <label for="password">Password:</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="loginData.password"
          name="password"
          required
          />
      }

      <!-- Campi per la registrazione -->
      @if (isRegistering) {
        <label for="firstname">Nome:</label>
        <input
          type="text"
          id="firstname"
          [(ngModel)]="registerData.firstName"
          name="firstname"
          required
          />
        <label for="lastname">Cognome:</label>
        <input
          type="text"
          id="lastname"
          [(ngModel)]="registerData.lastName"
          name="lastname"
          required
          />
        <label for="username">Username:</label>
        <input
          type="text"
          id="username"
          [(ngModel)]="registerData.username"
          name="username"
          required
          />
        <label for="email">Email:</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="registerData.email"
          name="email"
          required
          />
        <label for="password">Password:</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="registerData.password"
          name="password"
          required
          />
      }

      <!-- Pulsanti -->
      <button type="submit">
        {{ isRegistering ? 'Registrati' : 'Login' }}
      </button>
    </form>

    <!-- Link per cambiare modalità -->
    <p>
      @if (!isRegistering) {
        Non hai un account? <a (click)="toggleRegister()">Registrati</a>
      }
      @if (isRegistering) {
        Hai già un account? <a (click)="toggleRegister()">Login</a>
      }
    </p>
  </div>
</div>
