<div class="auth-container">
  <div class="form-wrapper">
    <!-- Form dinamico -->
    <h2 *ngIf="!isRegistering">Login</h2>
    <h2 *ngIf="isRegistering">Registrati</h2>

    <form (ngSubmit)="isRegistering ? onRegister() : onLogin()">
      <!-- Campi per il login -->
      <ng-container *ngIf="!isRegistering">
        <label for="username">Username:</label>
        <input
          type="text"
          id="username"
          [(ngModel)]="loginData.username"
          name="username"
          required
        />

        <label for="password">Password:</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="loginData.password"
          name="password"
          required
        />
      </ng-container>

      <!-- Campi per la registrazione -->
      <ng-container *ngIf="isRegistering">
        <label for="firstname">Nome:</label>
        <input
          type="text"
          id="firstname"
          [(ngModel)]="registerData.firstName"
          name="firstname"
          required
        />

        <label for="lastname">Cognome:</label>
        <input
          type="text"
          id="lastname"
          [(ngModel)]="registerData.lastName"
          name="lastname"
          required
        />

        <label for="username">Username:</label>
        <input
          type="text"
          id="username"
          [(ngModel)]="registerData.username"
          name="username"
          required
        />

        <label for="email">Email:</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="registerData.email"
          name="email"
          required
        />

        <label for="password">Password:</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="registerData.password"
          name="password"
          required
        />
      </ng-container>

      <!-- Pulsanti -->
      <button type="submit">
        {{ isRegistering ? 'Registrati' : 'Login' }}
      </button>
    </form>

    <!-- Link per cambiare modalità -->
    <p>
      <ng-container *ngIf="!isRegistering">
        Non hai un account? <a (click)="toggleRegister()">Registrati</a>
      </ng-container>
      <ng-container *ngIf="isRegistering">
        Hai già un account? <a (click)="toggleRegister()">Login</a>
      </ng-container>
    </p>
  </div>
</div>
