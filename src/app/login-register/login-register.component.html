<div class="auth-container">
  <!-- Toast Notification -->
  <div class="toast-container" [class.show]="toast.show" [class.success]="toast.type === 'success'" 
       [class.error]="toast.type === 'error'" [class.info]="toast.type === 'info'">
    <div class="toast-content">
      <div class="toast-icon">
        <span *ngIf="toast.type === 'success'">✓</span>
        <span *ngIf="toast.type === 'error'">✕</span>
        <span *ngIf="toast.type === 'info'">ℹ</span>
      </div>
      <div class="toast-message">{{ toast.message }}</div>
      <button class="toast-close" (click)="closeToast()">×</button>
    </div>
    <div class="toast-progress" [class.animate]="toast.show"></div>
  </div>

  <div class="form-wrapper" role="region" aria-labelledby="auth-heading">
    <div class="user-icon">
      <img src="/login-user.png" alt="User Icon" />
    </div>
    <h2 id="auth-heading">
      {{ isRegistering ? 'Unisciti a noi' : 'Bentornato!' }}
    </h2>
    <p class="sub-heading">
      {{ isRegistering ? 'Crea un nuovo account per iniziare' : 'Accedi al tuo account per continuare' }}
    </p>

    <form (ngSubmit)="isRegistering ? onRegister() : onLogin()" #authForm="ngForm" autocomplete="on" novalidate>
      <div class="input-group" *ngIf="isRegistering">
        <label for="username">Nome utente</label>
        <div class="input-with-icon">
          <label for="username">
            <img src="/login-user.png" alt="Username Icon" />
          </label>
          <input id="username" name="username" type="text" [(ngModel)]="registerData.username" required minlength="2"
            placeholder="Il tuo nome utente" />
        </div>
      </div>

      <div class="input-group">
        <label for="email">Email</label>
        <div class="input-with-icon">
          <label for="email">
            <img src="/email-icon.png" alt="Email Icon" />
          </label>
          <input id="email" name="email" type="email" [(ngModel)]="emailModel" required email
            placeholder="esempio@email.com" autocomplete="off"/>
        </div>
      </div>

      <div class="input-group password-group">
        <label for="password">Password</label>
        <div class="input-with-icon">
          <label for="password">
            <img src="/padlock.png" alt="Password Icon" />
          </label>
          <input id="password" name="password" [type]="passwordType" [(ngModel)]="passwordModel" required
            placeholder="La tua password" />
          <span class="toggle-password" (click)="togglePasswordVisibility()">
            <img *ngIf="passwordType === 'password'" src="/hide.png" alt="Hide Password" />
            <img *ngIf="passwordType === 'text'" src="/show.png" alt="Show Password" />
          </span>
        </div>
      </div>

      <div class="options-group" *ngIf="!isRegistering">
        <div class="remember-me">
          <div class="remember-me">
            <input type="checkbox" id="rememberMe" name="rememberMe" 
                   [(ngModel)]="loginData.rememberMe" />
            <label for="rememberMe">Ricordami</label>
          </div>
          <label for="rememberMe">Ricordami</label>
        </div>
        <a class="forgot-password" routerLink="/">Password dimenticata?</a>
      </div>

      <button type="submit" [disabled]="isLoading || authForm.invalid">
        <span *ngIf="!isLoading">{{ isRegistering ? 'Registrati' : 'Accedi' }}</span>
        <span *ngIf="isLoading" class="loading-spinner">
          <span class="spinner"></span>
          {{ isRegistering ? 'Registrazione...' : 'Accesso...' }}
        </span>
      </button>

      <p class="toggle-link-container">
        <span *ngIf="!isRegistering">Non hai un account?
          <a (click)="toggleRegister()" role="button" tabindex="0">Registrati</a>
        </span>
        <span *ngIf="isRegistering">Hai già un account?
          <a (click)="toggleRegister()" role="button" tabindex="0">Accedi</a>
        </span>
      </p>

      <p *ngIf="accessoEffettuato" class="connected-message">
        Sei già connesso.
      </p>
    </form>
  </div>
</div>
