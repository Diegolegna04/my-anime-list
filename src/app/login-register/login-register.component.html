<div class="auth-container">
  <div class="form-wrapper" role="region" aria-labelledby="auth-heading">
    <h2 id="auth-heading">{{ isRegistering ? 'Registrati' : 'Accedi' }}</h2>

    <form (ngSubmit)="isRegistering ? onRegister() : onLogin()" #authForm="ngForm" autocomplete="on" novalidate>
      <!-- Username (solo registrazione) -->
      <div *ngIf="isRegistering">
        <label for="username">Username</label>
        <input
          id="username"
          name="username"
          type="text"
          [(ngModel)]="registerData.username"
          required
          minlength="2"
          placeholder="Scegli un username" />
      </div>

      <!-- Email (con binding condiviso via getter/setter emailModel) -->
      <div>
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="emailModel"
          required
          email
          placeholder="esempio@dominio.com" />
      </div>

      <!-- Password (con binding condiviso via getter/setter passwordModel) -->
      <div>
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="passwordModel"
          required
          minlength="6"
          placeholder="Inserisci la password" />
      </div>

      <!-- Pulsante principale -->
      <button
        type="submit"
        [disabled]="isLoading || authForm.invalid">
        {{ isRegistering ? 'Registrati' : 'Accedi' }}
      </button>

      <!-- Indicatore caricamento -->
      <p *ngIf="isLoading" role="status">Caricamento in corso…</p>

      <!-- Link per switch tra login/registrazione -->
      <p>
        <span *ngIf="!isRegistering">Non hai un account?
          <a (click)="toggleRegister()" role="button" tabindex="0">Registrati</a>
        </span>
        <span *ngIf="isRegistering">Hai già un account?
          <a (click)="toggleRegister()" role="button" tabindex="0">Accedi</a>
        </span>
      </p>

      <!-- Messaggio quando l'accesso è già stato effettuato -->
      <p *ngIf="accessoEffettuato">Sei già connesso.</p>
    </form>
  </div>
</div>
