<div>
  <div class="he">
    <h1 (click)="goToHome()">Anime List</h1>
    @if (!accessoEffettuato) {
      <button (click)="goToLoginRegister()">Login/Registrati</button>
    }
    @if (accessoEffettuato) {
      <div class="profile-pic" routerLink="/profile">
        <img [src]="profileImage" alt="Profile Image">
        <span>{{ username }}</span>
      </div>
    }
  </div>
  <app-header></app-header>
  <router-outlet></router-outlet>
  <app-footer></app-footer>
</div>
