<div class="controls">
  <div class="sort-select">
    <label for="sortCriteria">Ordina per:</label>
    <select id="sortCriteria" (change)="sortAnime($event)">
      <option value="members">Membri</option>
      <option value="score">Voti</option>
      <option value="date">Novità</option>
    </select>
  </div>
  <div class="view-toggle">
    <button (click)="toggleView()" aria-label="Cambia Visualizzazione">
      <i [class]="isGridView ? 'fas fa-list' : 'fas fa-th'"></i>
    </button>
  </div>
</div>
<div [class.grid]="isGridView" [class.list]="!isGridView" class="anime-container">
  <div *ngFor="let anime of animeList" class="anime-card" (click)="goToDetails(anime.mal_id)">
    <img
      [src]="anime.images.jpg.image_url"
      alt="{{ anime.title }}"
      class="anime-img"
    />
    <h3>{{ anime.title }}</h3>
  </div>
</div>
