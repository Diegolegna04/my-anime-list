<div *ngIf="animeDetails" class="anime">
  <div class="main-content">
    <h1 class="anime-title">{{ animeDetails.title }}</h1>
    <div class="anime-details">
      <img [src]="animeDetails.images.jpg.large_image_url" alt="{{ animeDetails.title }}"/>
      <div class="text">
        <p class="synopsis">{{ animeDetails.synopsis }}</p>
        <div class="details-info">
          <p><strong>Episodes:</strong> {{ animeDetails.episodes }}</p>
          <p><strong>Score:</strong> {{ animeDetails.score }}</p>
          <p><strong>Status:</strong> {{ animeDetails.status }}</p>
          <p><strong>Genres:</strong>
            <span *ngFor="let genre of animeDetails.genres; let last = last">
              {{ genre.name }}<span *ngIf="!last">, </span>
            </span>
          </p>
        </div>
      </div>
    </div>
    <br/>

    <div class="visti-section">
      <!-- Bottone "Visto" -->
      <button (click)="toggleVisto()">
        {{ visto ? 'Segnala come Non Visto' : 'Segnala come Visto' }}
      </button>
    </div>

    <!-- Sezione per scegliere il voto -->
    <div class="voto-section">
      <label for="voto">Voto:</label>
      <input type="range" id="voto" min="1" max="10" [(ngModel)]="voto" (change)="setVoto(voto)" />
      <span>{{ voto }}</span> <!-- Mostra il punteggio selezionato -->
    </div>

    <!-- Sezione "Preferito" -->
    <div class="preferito-section">
      <label>Preferito?</label>
      <span (click)="togglePreferito()" [class.active]="preferito" class="star-icon">&#9733;</span>
    </div>
  </div>

  <!-- Sezione consigliati -->
  <div class="recommended-section">
    <h2>Recommended Anime</h2>
    <div class="recommended-list">
      <div *ngFor="let anime of displayedRecommendedAnime"
           class="recommended-card"
           (click)="viewAnimeDetails(anime.mal_id)">
        <img [src]="anime.images.jpg.image_url" alt="{{ anime.title }}"/>
        <h4>{{ anime.title }}</h4>
      </div>
    </div>
    <button *ngIf="displayedRecommendedAnime.length < recommendedAnime.length"
            (click)="loadMoreAnime()"
            class="load-more-btn">
      Load More
    </button>
  </div>
</div>
