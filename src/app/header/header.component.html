<header class="app-header">
  <!-- Mobile Layout -->
  <div class="mobile-header">
    <div class="mobile-top-row">
      <a routerLink="/" class="app-logo" (click)="goToHome()">
        <img src="logo-circle.webp" width="60" height="60" alt="" class="logo-image" />
        <span>My Anime DB</span>
      </a>

      <div class="mobile-actions">
        <button
          type="button"
          (click)="toggleTheme()"
          class="mobile-icon-btn theme-toggle-btn"
          [attr.aria-label]="currentTheme === 'light' ? 'Attiva tema scuro' : 'Attiva tema chiaro'"
        >
          <i
            [class]="currentTheme === 'light' ? 'fas fa-moon' : 'fas fa-sun'"
            aria-hidden="true"
          ></i>
        </button>

        <button
          type="button"
          (click)="toggleMobileMenu()"
          class="mobile-menu-btn"
          [class.active]="showMobileMenu"
          aria-label="Apri il menu"
          aria-controls="mobile-menu"
          [attr.aria-expanded]="showMobileMenu"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>

    <!-- Search Bar Mobile -->
    <form class="mobile-search-bar search-form" role="search" (ngSubmit)="searchAnime()">
      <div class="search-bar">
        <input
          type="search"
          name="q-mobile"
          [ngModel]="query"
          (ngModelChange)="onQueryChange($event)"
          (keydown)="onSearchKeydown($event)"
          (focus)="onSearchFocus()"
          placeholder="Cerca un anime..."
          aria-label="Cerca un anime"
          autocomplete="off"
          role="combobox"
          aria-autocomplete="list"
          aria-controls="search-suggest-mobile"
          [attr.aria-expanded]="suggestOpen"
          [attr.aria-activedescendant]="
            activeIndex >= 0 ? 'search-suggest-mobile-' + activeIndex : null
          "
          class="search-input"
        />
        <button type="submit" class="search-btn" aria-label="Cerca">
          <i class="fas fa-search" aria-hidden="true"></i>
        </button>
      </div>
      <ng-container
        *ngTemplateOutlet="suggestTpl; context: { $implicit: 'search-suggest-mobile' }"
      ></ng-container>
    </form>

    <!-- Mobile Menu Overlay -->
    <!-- Sfondo cliccabile solo col mouse: da tastiera il menu si chiude con Esc o col pulsante. -->
    <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
    <div class="mobile-menu-overlay" [class.show]="showMobileMenu" (click)="closeMobileMenu()">
      <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
      <nav
        class="mobile-menu"
        id="mobile-menu"
        aria-label="Menu"
        (click)="$event.stopPropagation()"
      >
        <div class="mobile-menu-header">
          @if (accessoEffettuato) {
            <div class="mobile-profile-info">
              <img [src]="profileImage" alt="" class="mobile-profile-pic" />
              <span class="mobile-username">{{ username }}</span>
            </div>
          }
          <button
            type="button"
            (click)="closeMobileMenu()"
            class="close-menu-btn"
            aria-label="Chiudi il menu"
          >
            <i class="fas fa-times" aria-hidden="true"></i>
          </button>
        </div>

        <div class="mobile-menu-items">
          <a class="mobile-menu-item" routerLink="/genres" (click)="closeMobileMenu()">
            <i class="fas fa-filter" aria-hidden="true"></i>
            <span>Generi</span>
          </a>

          @if (!accessoEffettuato) {
            <a
              class="mobile-menu-item login-item"
              routerLink="/register-login"
              (click)="closeMobileMenu()"
            >
              <i class="fas fa-user-circle" aria-hidden="true"></i>
              <span>Accedi / Registrati</span>
            </a>
          } @else {
            <a class="mobile-menu-item" routerLink="/profile" (click)="closeMobileMenu()">
              <i class="fas fa-user" aria-hidden="true"></i>
              <span>Il mio profilo</span>
            </a>
            <button type="button" class="mobile-menu-item logout-item" (click)="logout()">
              <i class="fas fa-sign-out-alt" aria-hidden="true"></i>
              <span>Esci</span>
            </button>
          }
        </div>
      </nav>
    </div>
  </div>

  <!-- Desktop Layout -->
  <div class="desktop-header">
    <div class="header-left">
      <a routerLink="/" class="app-logo" (click)="goToHome()">
        <img src="logo-circle.webp" width="60" height="60" alt="" class="logo-image" />
        <span>My Anime DB</span>
      </a>
    </div>

    <div class="header-center"></div>

    <div class="header-right">
      <button
        type="button"
        (click)="toggleTheme()"
        class="action-button secondary theme-toggle-btn"
        [attr.aria-label]="currentTheme === 'light' ? 'Attiva tema scuro' : 'Attiva tema chiaro'"
      >
        <i [class]="currentTheme === 'light' ? 'fas fa-moon' : 'fas fa-sun'" aria-hidden="true"></i>
      </button>

      <a routerLink="/genres" class="action-button secondary">
        <i class="fas fa-filter" aria-hidden="true"></i>
        <span>Generi</span>
      </a>

      <form class="search-section search-form" role="search" (ngSubmit)="searchAnime()">
        <div class="search-bar">
          <input
            type="search"
            name="q"
            [ngModel]="query"
            (ngModelChange)="onQueryChange($event)"
            (keydown)="onSearchKeydown($event)"
            (focus)="onSearchFocus()"
            placeholder="Cerca un anime..."
            aria-label="Cerca un anime"
            autocomplete="off"
            role="combobox"
            aria-autocomplete="list"
            aria-controls="search-suggest-desktop"
            [attr.aria-expanded]="suggestOpen"
            [attr.aria-activedescendant]="
              activeIndex >= 0 ? 'search-suggest-desktop-' + activeIndex : null
            "
            class="search-input"
          />
          <button type="submit" class="search-btn" aria-label="Cerca">
            <i class="fas fa-search" aria-hidden="true"></i>
          </button>
        </div>
        <ng-container
          *ngTemplateOutlet="suggestTpl; context: { $implicit: 'search-suggest-desktop' }"
        ></ng-container>
      </form>

      @if (!accessoEffettuato) {
        <a routerLink="/register-login" class="action-button primary">
          <i class="fas fa-user-circle" aria-hidden="true"></i>
          <span>Accedi / Registrati</span>
        </a>
      } @else {
        <div class="profile-menu-container" [ngClass]="{ 'show-dropdown': showDropdown }">
          <button
            type="button"
            class="profile-pic-area"
            (click)="toggleDropdown()"
            aria-controls="profile-menu"
            [attr.aria-expanded]="showDropdown"
          >
            <img [src]="profileImage" alt="" class="profile-pic-thumb" />
            <span class="profile-username">{{ username }}</span>
            <i
              class="fas fa-caret-down dropdown-arrow"
              [class.rotated]="showDropdown"
              aria-hidden="true"
            ></i>
          </button>

          <div class="dropdown-menu" id="profile-menu">
            <a routerLink="/profile" (click)="showDropdown = false"
              ><i class="fas fa-user" aria-hidden="true"></i> Il mio profilo</a
            >
            <button type="button" (click)="logout()">
              <i class="fas fa-sign-out-alt" aria-hidden="true"></i> Esci
            </button>
          </div>
        </div>
      }
    </div>
  </div>
</header>

<!-- Anteprima dei risultati, la stessa sotto la ricerca desktop e mobile -->
<ng-template #suggestTpl let-listId>
  @if (suggestOpen) {
    <app-search-suggest
      [listId]="listId"
      [suggestions]="suggestions"
      [loading]="suggestLoading"
      [query]="query"
      [(activeIndex)]="activeIndex"
      (chosen)="openSuggestion($event)"
    />
  }
</ng-template>
