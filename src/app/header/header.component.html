<div class="nav">
  <!-- Bottone per filtrare per genere -->
  <button (click)="goToGenres()" class="genre-btn">Filtra per genere</button>

  <!-- Contenitore per la barra di ricerca -->
  <div class="search-container">
    <!-- Bottone per mostrare/nascondere la barra di ricerca -->
    <button (click)="toggleSearchBar()" class="toggle-search-btn">🔎</button>

    <!-- Barra di ricerca -->
    <div *ngIf="showSearchBar" class="search-bar">
      <input
        type="text"
        [(ngModel)]="query"
        (keyup.enter)="searchAnime()"
        placeholder="Cerca un anime..."
        class="search-input"
      />
      <button (click)="searchAnime()" class="search-btn">Cerca</button>
    </div>
  </div>
</div>
