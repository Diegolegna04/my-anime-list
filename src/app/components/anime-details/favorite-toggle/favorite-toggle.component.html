<div class="preferito-section">
  <span class="section-label">
    <i class="fas fa-heart label-icon" aria-hidden="true"></i>
    Aggiungi ai Preferiti:
  </span>
  <button
    type="button"
    id="preferito-toggle"
    class="btn btn-sm favorite-toggle-btn"
    [class.btn-primary]="isFavorite"
    [class.btn-secondary]="!isFavorite"
    [class.active]="isFavorite"
    [attr.aria-pressed]="isFavorite"
    [disabled]="!canFavorite"
    (click)="onToggle()">
    <i class="fas fa-heart star-icon" aria-hidden="true"></i>
    {{ isFavorite ? 'Rimuovi dai Preferiti' : 'Aggiungi ai Preferiti' }}
  </button>
</div>
