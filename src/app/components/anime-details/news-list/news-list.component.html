@if (news.length > 0) {
  <section class="news-section">
    <div class="news-header">
      <h2 class="section-title">News</h2>
      <div class="news-actions">
        @if (!isExpanded) {
          <button type="button" class="btn btn-primary btn-sm expand-btn" (click)="toggleExpand()" aria-expanded="false">
            <i class="fas fa-newspaper" aria-hidden="true"></i>
            Mostra News ({{ news.length }})
          </button>
        } @else {
          <button type="button" class="btn btn-secondary btn-sm collapse-header-btn" (click)="collapse()" aria-expanded="true">
            <i class="fas fa-chevron-up" aria-hidden="true"></i>
            Nascondi News
          </button>
        }
      </div>
    </div>

    @if (isExpanded) {
      <div class="news-list">
        @for (item of displayedNews; track item.mal_id) {
          <article class="news-card">
            <h3>
              <a
                [href]="item.url"
                target="_blank"
                rel="noopener noreferrer">
                {{ item.title }}
              </a>
            </h3>

            <p class="news-excerpt">{{ item.excerpt }}</p>
          </article>
        }
      </div>

      @if (hasMoreNews) {
        <div class="load-more">
          <button type="button" class="btn btn-secondary load-more-btn" (click)="loadMore()">
            <i class="fas fa-plus" aria-hidden="true"></i>
            Carica Altre News
          </button>
        </div>
      }
    }
  </section>
} @else {
  <div class="news-section empty">
    <div class="state">
      <span class="state-icon" aria-hidden="true"><i class="fas fa-newspaper"></i></span>
      <p class="state-text">Nessuna news disponibile per questo anime.</p>
    </div>
  </div>
}
