<aside class="recommended-section" aria-labelledby="recommended-title">
  <h2 class="section-title recommended-title" id="recommended-title">Anime Consigliati</h2>
  <div class="recommended-list">
    @for (anime of displayedAnime; track anime.mal_id) {
      <a
        class="recommended-card"
        [routerLink]="'/anime/' + anime.mal_id">
        <img [src]="anime.images.jpg.image_url" [alt]="anime.title" loading="lazy" />
        <h4>{{ anime.title }}</h4>
      </a>
    }
  </div>
  @if (displayedAnime.length < recommendedAnime.length) {
    <button
      type="button"
      class="btn btn-secondary btn-sm btn-block load-more-btn"
      (click)="loadMore()">
      <i class="fas fa-plus" aria-hidden="true"></i>
      Carica Altri
    </button>
  }
</aside>
