<section class="state-manager">
  <div class="state-manager-header">
    <h3 class="section-title">Stato Anime</h3>

    @if (showLoadingIndicator) {
      <div class="badge badge-accent loading-indicator" role="status">
        <span class="spinner spinner-sm" aria-hidden="true"></span>
        <span class="loading-text">Aggiornamento...</span>
      </div>
    }
  </div>

  <div class="state-buttons-container">
    @for (option of allStates; track trackByState($index, option)) {
      <button
        type="button"
        [class]="getButtonClass(option.value)"
        [disabled]="isDisabled(option.value)"
        [attr.aria-label]="option.label"
        [attr.aria-pressed]="isActive(option.value)"
        [title]="getTooltip(option.value)"
        (click)="onStateClick(option.value)">

        <i class="fas button-icon" [ngClass]="option.icon" aria-hidden="true"></i>

        <span class="button-label">
          {{ option.label }}
        </span>

        @if (isActive(option.value)) {
          <span class="active-indicator" aria-hidden="true">
            <i class="fas fa-check"></i>
          </span>
        }
      </button>
    }
  </div>

</section>
