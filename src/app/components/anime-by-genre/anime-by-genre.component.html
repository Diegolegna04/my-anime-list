<div class="genre-results-page">
  <div class="section-header">
    <h2 class="section-title">Risultati per {{ genreName?.toLowerCase() }}</h2>
    <div class="section-controls">
      <div class="sort-select">
        <label for="sortCriteria">Ordina per:</label>
        <select id="sortCriteria" [value]="currentSortCriteria" (change)="sortAnime($event)">
          <option value="score">Voti</option>
          <option value="members">Membri</option>
          <option value="date">Novità</option>
        </select>
      </div>
      <button (click)="toggleTitleLanguage()" class="language-toggle-btn">
        <i class="fas fa-language"></i>
        {{titleLanguage === 'english' ? 'Titolo Giapponese' : 'Titolo Inglese'}}
      </button>
      <div class="view-toggle">
        <button (click)="toggleView()" aria-label="Cambia Visualizzazione">
          <i [class]="isGridView ? 'fas fa-list' : 'fas fa-th-large'"></i>
        </button>
      </div>
    </div>
    @if (genreDescription) {
      <div class="genre-description-wrapper">
        <p class="genre-description" [class.expanded]="isDescriptionExpanded">{{ genreDescription }}</p>
        <button class="toggle-description-btn" (click)="isDescriptionExpanded = !isDescriptionExpanded">
          {{ isDescriptionExpanded ? 'Mostra meno' : 'Leggi tutto' }}
        </button>
      </div>
    }
  </div>

  <div [class]="isGridView ? 'grid' : 'list'" class="anime-container">
    @for (anime of animeList; track anime.mal_id) {
      <app-anime-card
        [anime]="anime"
        [titleLanguage]="titleLanguage"
        [viewMode]="isGridView ? 'grid' : 'list'">
      </app-anime-card>
    }
  </div>

  @if (!isLoading) {
    <button (click)="loadMoreAnime()" class="load-more-btn">
      <i class="fas fa-plus-circle"></i> Carica Altri Anime
    </button>
  }
</div>
