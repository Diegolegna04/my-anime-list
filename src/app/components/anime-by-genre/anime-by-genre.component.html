<div class="genre-results-page">
  <!-- Titolo e Controlli -->
  <div class="section-header">
    <h2 class="section-title">Risultati per {{ genreName }}</h2>
    <div class="section-controls">
      <div class="sort-select">
        <label for="sortCriteria">Ordina per:</label>
        <select id="sortCriteria" (change)="sortAnime($event)">
          <option value="score">Voti</option>
          <option value="members">Membri</option>
          <option value="date">Novità</option>
        </select>
      </div>
      <button (click)="toggleTitleLanguage()" class="language-toggle-btn">
        <i class="fas fa-language"></i>
        {{titleLanguage === 'english' ? 'Titolo Giapponese' : 'Titolo Inglese'}}
      </button>
      <div class="view-toggle">
        <button (click)="toggleView()" aria-label="Cambia Visualizzazione">
          <i [class]="isGridView ? 'fas fa-list' : 'fas fa-th-large'"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Lista Anime -->
  <div [class]="isGridView ? 'grid' : 'list'" class="anime-container">
    @for (anime of animeList; track anime) {
      <div class="anime-card" (click)="goToDetails(anime.mal_id)">
        <img [src]="anime.images.jpg.image_url" alt="{{ getTitle(anime) }}" />
        <div class="anime-card-content">
          <h3 class="anime-title">{{ getTitle(anime) }}</h3>
          <div class="anime-meta">
            @if (anime.score) {
              <div class="anime-score">
                <i class="fas fa-star"></i> {{anime.score}}
              </div>
            }
            <div class="anime-type">
              {{anime.type || 'N/A'}}
            </div>
          </div>
        </div>
      </div>
    }
  </div>

  <!-- Bottone Carica Altri -->
  @if (!isLoading) {
    <button (click)="loadMoreAnime()" class="load-more-btn">
      <i class="fas fa-plus-circle"></i> Carica Altri Anime
    </button>
  }
</div>
