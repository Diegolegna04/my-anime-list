<div class="search-results">
  <h1 class="title">Search Results for "{{ query }}"</h1>

  <!-- Contenitore per i risultati della ricerca -->
  <div *ngIf="searchResults.length > 0; else noResults" class="anime-container">
    <div
      *ngFor="let anime of searchResults"
      class="anime-card"
      (click)="goToDetails(anime.mal_id)"
    >
      <img [src]="anime.images.jpg.image_url" alt="{{ anime.title }}" />
      <h3>{{ anime.title }}</h3>
    </div>
  </div>

  <!-- Messaggio se non ci sono risultati -->
  <ng-template #noResults>
    <div class="no-results">
      <p>No results found for "{{ query }}". Please try a different search.</p>
    </div>
  </ng-template>
</div>
