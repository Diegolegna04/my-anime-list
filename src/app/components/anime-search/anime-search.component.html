<h2 class="section-title">Risultati per "{{ query }}"</h2>
<div class="search-results">
  <!-- Titolo della pagina -->
  <div class="div">
    <div class="sort-select">
      <label for="sortCriteria">Ordina per: </label>
      <select id="sortCriteria" (change)="sortAnime($event)">
        <option value="members">Membri</option>
        <option value="score">Voti</option>
        <option value="date">Novità</option>
      </select>
    </div>
    <!-- Bottone per cambiare visualizzazione -->
    <div class="view-toggle">
      <button (click)="toggleView()" aria-label="Cambia Visualizzazione">
        <i [class]="isGridView ? 'fas fa-list' : 'fas fa-th'"></i>
      </button>
    </div>
  </div>
  <!-- Contenitore per i risultati della ricerca -->
  @if (searchResults.length > 0) {
    <div [class.grid]="isGridView" [class.list]="!isGridView"
      class="anime-container">
      @for (anime of searchResults; track anime) {
        <div
          class="anime-card"
          (click)="goToDetails(anime.mal_id)">
          <img [src]="anime.images.jpg.image_url" alt="{{ anime.title }}"/>
          <h3 class="anime-title">{{ anime.title }}</h3>
        </div>
      }
    </div>
  } @else {
    <div class="no-results">
      <p>Non ci sono risultati per "{{ query }}". Prova una ricerca diversa.</p>
    </div>
  }

  <!-- Messaggio se non ci sono risultati -->

  <!-- Bottone per tornare alla Home -->
  <button class="load-more-btn" (click)="goBackToHome()">Torna alla Home</button>
</div>
