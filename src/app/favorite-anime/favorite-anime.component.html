<div class="intro">
  <div class="intro-content">
    <h1>Anime Preferiti</h1>
    <p>Qui puoi trovare tutti i tuoi anime preferiti.</p>
  </div>
</div>

@if (favoriteAnime.length > 0) {
  <div>
    <div class="anime-container">
      @for (anime of favoriteAnime; track anime) {
        <div class="anime-card" (click)="goToDetails(anime.mal_id)">
          <img [src]="anime.images.jpg.large_image_url" alt="{{ anime.title }}" />
          <h3>{{ anime.title }}</h3>
        </div>
      }
    </div>
  </div>
} @else {
  <h2>Nessun anime preferito trovato.</h2>
}
